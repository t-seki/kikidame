name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Unit tests (JVM + Robolectric, no emulator)
        run: ./gradlew test --no-daemon
      # lint（#111）: MissingTranslation（values/ と values-ja/ の片方だけの追加）と UnsafeOptInUsageError を落とす
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
  # release ビルド（#186）と aboutlibraries.json の鮮度（#187）。署名なし（KIKIDAME_KEYSTORE を渡さない）で回し、Secrets は使わない
  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Release build (unsigned, R8)
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: aboutlibraries.json is up to date
        run: |
          ./gradlew :app:exportLibraryDefinitions --no-daemon
          if ! git diff --exit-code -- app/src/main/res/raw/aboutlibraries.json; then
            echo "::error::app/src/main/res/raw/aboutlibraries.json が古い。./gradlew :app:exportLibraryDefinitions を流して app/src/main/res/raw/aboutlibraries.json をコミットする"
            exit 1
          fi
