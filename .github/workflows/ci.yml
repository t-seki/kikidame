name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (JVM + Robolectric, no emulator)
        run: ./gradlew test --no-daemon
      # lint（#111）: MissingTranslation（values/ と values-ja/ の片方だけの追加）と UnsafeOptInUsageError を落とす
      - name: Lint
        run: ./gradlew :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            app/build/reports/lint-results-debug.*
