name: Release
# v1.2.3 のタグを push すると署名した AAB をビルドし、Google Play のクローズド テストのトラックに上げる（ADR 0015）。GitHub Release は作らない。
# 署名はアップロード鍵（Play アプリ署名の鍵は Google が持つ）。Secrets: KEYSTORE_BASE64（.jks を base64 にしたもの）、KEYSTORE_PASSWORD、KEY_ALIAS、KEY_PASSWORD。
# Play への upload は Secrets: PLAY_SERVICE_ACCOUNT_JSON（サービス アカウントの JSON 鍵）。
# リリースノートは fastlane/metadata/android/<locale>/changelogs/<versionCode>.txt を whatsnew-<locale> に写して渡す。R8 の mapping.txt も一緒に上げる。
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0   # 直前のタグの versionCode と比べるため
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: 25
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: platforms;android-37.0 build-tools;36.0.0 platform-tools
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
      - name: Check that the tag matches versionName
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$tag" != "$name" ]; then
            echo "tag v$tag does not match versionName $name in app/build.gradle.kts" >&2
            exit 1
          fi
      - name: Check that versionCode increased since the previous tag
        # versionCode を上げ忘れると Play が同じ versionCode の AAB を受け付けず、upload が落ちる
        run: |
          code="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          prev="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          if [ -z "$prev" ]; then
            echo "no previous tag; versionCode=$code"
            exit 0
          fi
          prev_code="$(git show "$prev:app/build.gradle.kts" | sed -n 's/.*versionCode = \([0-9]*\).*/\1/p')"
          echo "previous $prev versionCode=$prev_code, this versionCode=$code"
          if [ -z "$code" ] || [ -z "$prev_code" ] || [ "$code" -le "$prev_code" ]; then
            echo "versionCode must increase (previous $prev_code, now $code)" >&2
            exit 1
          fi
      - name: Decode keystore
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      - name: Build signed release AAB
        run: ./gradlew :app:bundleRelease --no-daemon
        env:
          KIKIDAME_KEYSTORE: ${{ runner.temp }}/upload.jks
          KIKIDAME_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KIKIDAME_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KIKIDAME_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      - name: Copy changelogs to whatsnew directories
        # upload-google-play は whatsnew-<BCP 47 の locale> の名前のファイルを読む
        run: |
          code="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          mkdir -p "$RUNNER_TEMP/whatsnew"
          for locale in en-US ja-JP; do
            cp "fastlane/metadata/android/$locale/changelogs/$code.txt" "$RUNNER_TEMP/whatsnew/whatsnew-$locale"
          done
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: dev.tseki.kikidame
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          # クローズド テストのトラックの API での名前は未確認（既定のクローズド トラックなら alpha の見込み）。最初のタグの前に Play Console で確かめる
          tracks: alpha
          status: completed
          whatsNewDirectory: ${{ runner.temp }}/whatsnew
          mappingFile: app/build/outputs/mapping/release/mapping.txt
